services:
  postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    container_name: jchatmind-postgres
    environment:
      POSTGRES_DB: jchatmind
      POSTGRES_USER: jchatmind
      POSTGRES_PASSWORD: jchatmind123
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jchatmind -d jchatmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
