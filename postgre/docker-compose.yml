services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindharness-postgres:local
    container_name: mindharness-postgres
    environment:
      POSTGRES_DB: mindharness
      POSTGRES_USER: mindharness
      POSTGRES_PASSWORD: mindharness123
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindharness -d mindharness"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
